name: Compilar APK Android .NET MAUI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite pulsar "Run workflow" desde el móvil

jobs:
  build:
    name: Compilar APK Release
    runs-on: ubuntu-latest
    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Descomprimir si se subió como ZIP desde el móvil
      run: |
        if ls *.zip 1> /dev/null 2>&1; then
          echo "ZIP detectado. Descomprimiendo en el servidor..."
          unzip -o *.zip
        fi
        if [ ! -f "EscanerEmpresa/EscanerEmpresa.csproj" ]; then
          FOUND_CSPROJ=$(find . -name "EscanerEmpresa.csproj" | head -n 1)
          if [ -n "$FOUND_CSPROJ" ]; then
            FOUND_DIR=$(dirname "$FOUND_CSPROJ")
            cp -r "$FOUND_DIR"/* . || true
          fi
        fi

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Instalar Workload .NET MAUI Android
      run: dotnet workload install maui-android

    - name: Restaurar Paquetes NuGet
      run: dotnet restore EscanerEmpresa/EscanerEmpresa.csproj

    - name: Compilar y Publicar APK
      run: |
        dotnet publish EscanerEmpresa/EscanerEmpresa.csproj \
          -f net8.0-android \
          -c Release \
          -p:AndroidPackageFormat=apk

    - name: Subir APK Generado
      uses: actions/upload-artifact@v4
      with:
        name: EscanerEmpresa-Android-APK
        path: EscanerEmpresa/bin/Release/net8.0-android/publish/*.apk
